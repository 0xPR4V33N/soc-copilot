name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate sample artifacts
        run: |
          python -c "import json; json.load(open('data/samples/events.json')); json.load(open('data/samples/triaged.json')); json.load(open('data/samples/labels.json'))"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v

      - name: Compile all Python files
        run: |
          python -m compileall -q src scripts tests
